name: Beta feedback
description: Report a gameplay bug, confusing interaction, or accessibility barrier.
title: "[Beta] "
labels:
  - beta-feedback
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Stack City. GitHub issues are public. Do not include names, email addresses, challenge titles, save data, screenshots containing personal information, or security vulnerabilities. Report security issues privately through GitHub Security Advisories.
  - type: dropdown
    id: feedback-type
    attributes:
      label: Feedback type
      options:
        - Gameplay bug
        - User interface issue
        - Accessibility barrier
        - Mobile or responsive issue
        - Balance or difficulty issue
        - Documentation issue
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: Example — Safari 18 on iPhone, or Chrome on Windows 11.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence that produces the problem.
      placeholder: |
        1. Start the Steady Growth guided run
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: Explain what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility context
      description: Optional — keyboard-only use, zoom level, reduced motion, high contrast, or assistive technology.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal information and understand that this report is public.
          required: true
